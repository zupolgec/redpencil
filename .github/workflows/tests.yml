name: tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Chromium
        run: uv run --no-project --with playwright playwright install --with-deps chromium
      - name: Tests
        run: uv run --no-project --with pytest --with playwright pytest -q tests
